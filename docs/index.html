<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg:   #ffffff; --bg2: #f7f7f5; --bg3: #eeedea;
  --txt:  #1c1c1a; --txt2: #6b6a64; --txt3: #a3a299;
  --bdr:  rgba(0,0,0,0.08); --bdr2: rgba(0,0,0,0.15);
  --mono: 'SF Mono', Monaco, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  --r-md: 8px; --r-lg: 12px;
  --pos: #1D9E75; --neg: #D85A30;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1c1c1a; --bg2:#2a2a28; --bg3:#333330;
    --txt:#f0efe8; --txt2:#a3a299; --txt3:#6b6a64;
    --bdr:rgba(255,255,255,0.10); --bdr2:rgba(255,255,255,0.18);
    --pos:#4ecb97; --neg:#f08060;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--txt);background:var(--bg);padding:20px 24px;line-height:1.5}

/* ── header ── */
.hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:20px;font-weight:600}
.hdr-meta{font-size:13px;color:var(--txt3);font-family:var(--mono);display:flex;align-items:center;gap:10px}
.total-krw{font-size:15px;color:var(--txt2);display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.total-krw strong{font-family:var(--mono);font-size:20px;color:var(--txt);font-weight:700}
.total-usd{font-size:13px;color:var(--txt3);font-family:var(--mono);font-weight:500}
.total-delta-val{font-size:14px;font-family:var(--mono);font-weight:600;padding:2px 8px;border-radius:5px}
.total-delta-val.pos{background:rgba(29,158,117,0.12);color:var(--pos)}
.total-delta-val.neg{background:rgba(216,90,48,0.12);color:var(--neg)}
.total-delta-val.neu{color:var(--txt3)}
/* 헤더 D-1: 한국식 색상 (양수=빨강 상승, 음수=파랑 하락) */
.total-delta-val.up{background:rgba(216,68,68,0.12);color:#D84444}
.total-delta-val.down{background:rgba(58,127,217,0.12);color:#3A7FD9}
.delta-label{font-size:11px;font-weight:500;opacity:0.7;margin-left:4px}
.total-fx{font-size:13px;color:var(--txt3);font-family:var(--mono);margin-top:3px}
.png-btn{
  font-size:12px;padding:6px 12px;border-radius:6px;border:0.5px solid var(--bdr);
  background:var(--bg2);color:var(--txt);cursor:pointer;font-family:var(--sans);
  transition:background .15s;
}
.png-btn:hover{background:var(--bg3)}
.png-btn:disabled{opacity:.5;cursor:wait}

/* ── tabs ── */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:0.5px solid var(--bdr);overflow-x:auto}
.tab{
  padding:10px 16px;background:transparent;border:none;cursor:pointer;
  font-size:14px;color:var(--txt2);font-family:var(--sans);
  border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;
}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--txt);border-bottom-color:var(--txt);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── market sections (top: macro/assets/indicators) ── */
.market-section{
  display:flex;align-items:center;margin-bottom:8px;
  padding:12px 16px;border-radius:var(--r-md);
  border:0.5px solid var(--bdr);
}
.market-section.macro{background:#F5F0E8;border-color:#DCD0BC}
.market-section.assets{background:#EEF2FA;border-color:#C8D6EC}
@media(prefers-color-scheme:dark){
  .market-section.macro{background:#2A2520;border-color:#403A30}
  .market-section.assets{background:#1F2638;border-color:#2E3A52}
}
.ms-label{
  font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--txt2);min-width:80px;flex-shrink:0;padding-right:8px;
  display:flex;align-items:center;gap:4px;
}
.ms-items{display:flex;flex-wrap:wrap;flex:1;gap:0}
.ms-item{
  flex:1;min-width:100px;padding:4px 14px;
  border-right:0.5px solid var(--bdr);display:flex;align-items:center;gap:10px;
}
.ms-item:last-child{border-right:none}
.ms-emoji{font-size:24px;line-height:1;flex-shrink:0}
.ms-meta{display:flex;flex-direction:column;flex:1;min-width:0}
.ms-name{font-size:11px;color:var(--txt3);margin-bottom:2px}
.ms-price{font-size:18px;font-weight:600;font-family:var(--mono);line-height:1.15}
.ms-chg{font-size:13px;font-family:var(--mono);margin-top:2px}

.indicators-section{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px;
}
@media(max-width:900px){.indicators-section{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.indicators-section{grid-template-columns:repeat(2,1fr)}}
.ind-card{
  padding:12px 14px;border-radius:var(--r-md);
  background:#F0F4ED;border:0.5px solid #C8D6BB;
}
@media(prefers-color-scheme:dark){
  .ind-card{background:#1F2A22;border-color:#324A38}
}
.ind-label{font-size:12px;color:var(--txt3);margin-bottom:4px}
.ind-value{font-size:22px;font-weight:600;font-family:var(--mono);line-height:1.1}
.ind-sub{font-size:11px;color:var(--txt2);margin-top:3px}
.ind-bar{height:5px;background:rgba(0,0,0,0.08);border-radius:3px;overflow:hidden;margin-top:6px}
@media(prefers-color-scheme:dark){.ind-bar{background:rgba(255,255,255,0.10)}}
.ind-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.ind-chg{font-size:11px;font-family:var(--mono);margin-top:4px}
.ind-chg.chg-pos{color:var(--pos)}.ind-chg.chg-neg{color:var(--neg)}.ind-chg.chg-neu{color:var(--txt3)}

/* ── section label ── */
.sec-label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px;margin-top:6px}

/* ── delta badge ── */
.delta{font-size:12px;font-family:var(--mono);margin-top:3px}
.delta.pos{color:var(--pos)}.delta.neg{color:var(--neg)}.delta.neu{color:var(--txt3)}

/* ── summary row (2-row layout) ── */
.summary-row-risky{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px;margin-bottom:8px}
.summary-row-safe{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px;margin-bottom:22px}
@media(max-width:700px){
  .summary-row-risky,.summary-row-safe{grid-template-columns:1fr 1fr}
}
.card-risk{background:#FCEBEB;border-radius:var(--r-md);padding:12px 14px}
.card-risk .label{font-size:14px;color:#791F1F;margin-bottom:4px;font-weight:500}
.card-risk .pct{font-size:24px;font-weight:600;color:#501313;line-height:1.1}
.card-risk .amt{font-size:12px;color:#791F1F;margin-top:3px;font-family:var(--mono)}
@media(prefers-color-scheme:dark){
  .card-risk{background:#3a1a1a}
  .card-risk .label,.card-risk .amt{color:#e07070}
  .card-risk .pct{color:#f0a0a0}
}
.card-safe{background:#EAF3DE;border-radius:var(--r-md);padding:12px 14px}
.card-safe .label{font-size:14px;color:#27500A;margin-bottom:4px;font-weight:500}
.card-safe .pct{font-size:24px;font-weight:600;color:#173404;line-height:1.1}
.card-safe .amt{font-size:12px;color:#27500A;margin-top:3px;font-family:var(--mono)}
@media(prefers-color-scheme:dark){
  .card-safe{background:#1a2e12}
  .card-safe .label,.card-safe .amt{color:#80c050}
  .card-safe .pct{color:#a0e070}
}
.cls-card{border-radius:var(--r-md);padding:11px 13px}
.cls-card .label{font-size:13px;margin-bottom:3px;font-weight:500}
.cls-card .pct{font-size:21px;font-weight:600;line-height:1.1}
.cls-card .amt{font-size:11px;margin-top:2px;font-family:var(--mono)}
.spark-wrap{margin-top:6px;line-height:0}
.spark-svg{cursor:pointer;opacity:.85;transition:opacity .15s}
.spark-svg:hover{opacity:1}

/* ── account grid ── */
.account-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:960px){.account-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.account-grid{grid-template-columns:1fr 1fr}}
.acct-card{border:0.5px solid var(--bdr);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acct-card .bar{height:4px;border-radius:2px;margin-bottom:2px}
.acct-card .name{font-size:16px;font-weight:600}
.acct-card .sub{font-size:11px;color:var(--txt3)}
.acct-card .amount{font-size:18px;font-weight:700;font-family:var(--mono);line-height:1.15}
.acct-card .pct-row{display:flex;align-items:center;gap:8px;margin-top:1px}
.acct-card .pct-val{font-size:14px;color:var(--txt2);white-space:nowrap;font-weight:500}
.acct-pnl{font-size:13px;color:var(--txt2);font-family:var(--mono);line-height:1.5;margin-top:4px;padding-top:6px;border-top:0.5px dashed var(--bdr)}
.acct-pnl .acct-pnl-strong{font-weight:700;font-size:13px}
.acct-pnl .pos,.acct-pnl-strong.pos{color:var(--pos)}
.acct-pnl .neg,.acct-pnl-strong.neg{color:var(--neg)}
/* 계좌 카드 D-1: 한국식 색상 */
.acct-d1{font-size:11px;font-family:var(--mono);color:var(--txt3);margin-top:2px;line-height:1.4}
.acct-d1 .up{color:#D84444;font-weight:600}
.acct-d1 .down{color:#3A7FD9;font-weight:600}
.acct-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.acct-card .top-row .left{flex:1;min-width:0}
.acct-card .top-row .right{flex:0 0 auto;text-align:right;font-size:10px;line-height:1.55;color:var(--txt3);max-width:160px;font-family:var(--mono);word-break:keep-all}
@media(max-width:600px){.acct-card .top-row .right{font-size:9px;max-width:none}}
.pbar{height:5px;flex:1;background:var(--bg2);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px}

/* ── holdings 2-col ── */
.holdings-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:1000px){.holdings-row{grid-template-columns:1fr}}
.holdings-col .col-label{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:10px}
.h-table{border:0.5px solid var(--bdr);border-radius:var(--r-lg);overflow-x:auto;overflow-y:hidden;margin-bottom:12px}
.h-table-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg2);border-bottom:0.5px solid var(--bdr)}
.h-table-hdr .acct-title{font-size:15px;font-weight:600}
.h-table-hdr .acct-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.h-table-hdr .acct-total-wrap{margin-left:12px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.h-table-hdr .acct-total{font-size:18px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.h-table-hdr .acct-pnl-summary{font-size:13px;font-family:var(--mono);margin-top:2px;font-weight:500;white-space:nowrap}
.h-table-hdr .acct-pnl-summary.pos{color:var(--pos)}
.h-table-hdr .acct-pnl-summary.neg{color:var(--neg)}

/* 7-column grid for core/satellite holdings */
.grid-head{display:grid;grid-template-columns:5px 0.8fr 1.6fr 0.45fr 1fr 1fr 1fr 0.7fr;padding:8px 14px 8px 0;background:var(--bg3);font-size:12px;color:var(--txt2);min-width:680px}
.grid-head>*{padding:0 4px}
.grid-head>*:nth-child(2){padding-left:10px}
.grid-head>*:nth-child(n+4){text-align:right}
.grid-row{display:grid;grid-template-columns:5px 0.8fr 1.6fr 0.45fr 1fr 1fr 1fr 0.7fr;padding:12px 14px 12px 0;border-top:0.5px solid var(--bdr);align-items:center;min-width:680px}
.grid-row .color-bar{height:38px}
.grid-row .cat{padding-left:10px;font-size:12px;color:var(--txt3)}
.grid-row .ticker-wrap{padding:0 4px}
.grid-row .ticker-wrap .tname{font-size:13px;font-weight:500;line-height:1.3}
.grid-row .ticker-wrap .tcode{font-size:11px;color:var(--txt3);font-family:var(--mono);margin-top:1px}
.grid-row .gpct{font-size:13px;font-weight:600;text-align:right;padding:0 4px}
.grid-row .gprincipal{font-size:12px;font-family:var(--mono);text-align:right;color:var(--txt3);padding:0 4px}
.grid-row .gamt{font-size:13px;font-family:var(--mono);text-align:right;padding:0 4px;font-weight:500}
.grid-row .gpnl{font-size:12px;font-family:var(--mono);text-align:right;padding:0 4px;font-weight:500}
.grid-row .gpnlpct{font-size:13px;font-family:var(--mono);text-align:right;padding:0 4px;font-weight:600}
.grid-row .gpnl.pos,.grid-row .gpnlpct.pos{color:var(--pos)}
.grid-row .gpnl.neg,.grid-row .gpnlpct.neg{color:var(--neg)}

.sat-head{display:grid;grid-template-columns:5px 1.4fr 0.45fr 1fr 1fr 1fr 0.7fr;padding:8px 14px 8px 0;background:var(--bg3);font-size:12px;color:var(--txt2);min-width:600px}
.sat-head>*{padding:0 4px}
.sat-head>*:nth-child(2){padding-left:10px}
.sat-head>*:nth-child(n+3){text-align:right}
.sat-row{display:grid;grid-template-columns:5px 1.4fr 0.45fr 1fr 1fr 1fr 0.7fr;padding:12px 14px 12px 0;border-top:0.5px solid var(--bdr);align-items:center;min-width:600px}
.sat-row .color-bar{height:38px}
.sat-row .sname-wrap{padding-left:10px}
.sat-row .sname{font-size:13px;font-weight:500;line-height:1.3}
.sat-row .scat{font-size:11px;color:var(--txt3);margin-top:1px}
.sat-row .spct{font-size:13px;font-weight:600;text-align:right;padding:0 4px}
.sat-row .sprincipal{font-size:12px;font-family:var(--mono);text-align:right;color:var(--txt3);padding:0 4px}
.sat-row .samt{font-size:13px;font-family:var(--mono);text-align:right;padding:0 4px;font-weight:500}
.sat-row .spnl{font-size:12px;font-family:var(--mono);text-align:right;padding:0 4px;font-weight:500}
.sat-row .spnlpct{font-size:13px;font-family:var(--mono);text-align:right;padding:0 4px;font-weight:600}
.sat-row .spnl.pos,.sat-row .spnlpct.pos{color:var(--pos)}
.sat-row .spnl.neg,.sat-row .spnlpct.neg{color:var(--neg)}

/* ── account rebalancing header ── */
.acct-rebal{padding:10px 16px;border-bottom:0.5px solid var(--bdr);background:var(--bg3);font-size:14px;line-height:1.7}
.acct-rebal-row{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:3px}
.acct-rebal-row:last-child{margin-bottom:0}
.acct-rebal-lbl{color:var(--txt2);flex-shrink:0;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.arb-item{color:var(--txt2);font-size:14px;white-space:nowrap}
.arb-item.alert{color:var(--neg);font-weight:700}
.arb-sep{color:var(--bdr2);margin:0 4px}

/* ── split buying bar ── */
.split-buy{padding:10px 14px;border-top:0.5px solid var(--bdr);background:var(--bg2)}
.split-buy .sb-title{font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:6px;display:flex;justify-content:space-between}
.sb-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:5px}
.sb-fill{height:100%;border-radius:3px;background:#534AB7;transition:width .4s}
.sb-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);font-family:var(--mono)}
.sb-rounds{display:flex;gap:4px;margin-top:6px}
.sb-round{font-size:9px;padding:2px 6px;border-radius:10px;font-family:var(--mono)}
.sb-round.done{background:#534AB720;color:#534AB7;border:0.5px solid #534AB740}
.sb-round.pending{background:var(--bg3);color:var(--txt3);border:0.5px solid var(--bdr)}

/* ── toss NVDA P&L ── */
.toss-pnl{padding:10px 14px;border-top:0.5px solid var(--bdr);background:var(--bg2)}
.toss-pnl-title{font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:6px}
.toss-pnl-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.toss-pnl-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px}
.toss-pnl-label{color:var(--txt3)}
.toss-pnl-val{font-family:var(--mono);font-weight:500}
.toss-pnl-big{font-size:14px;font-weight:700}

/* ── NVDA MDD gauge ── */
.nvda-mdd{padding:10px 14px;border-top:0.5px solid var(--bdr);background:var(--bg2)}
.mdd-title{font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.mdd-val{font-family:var(--mono);font-size:12px}
.mdd-track-wrap{position:relative;height:8px;background:var(--bg3);border-radius:4px;margin-bottom:4px;overflow:visible}
.mdd-seg-green{position:absolute;left:0;height:100%;border-radius:4px 0 0 4px;background:#1D9E75}
.mdd-seg-yellow{position:absolute;height:100%;background:#EF9F27}
.mdd-seg-red{position:absolute;height:100%;border-radius:0 4px 4px 0;background:#D85A30}
.mdd-marker{position:absolute;top:-3px;width:3px;height:14px;background:var(--txt);border-radius:2px;transform:translateX(-50%)}
.mdd-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--txt3);font-family:var(--mono);margin-top:2px}
.mdd-info{font-size:10px;color:var(--txt3);margin-top:4px}

/* ── metrics ── */
.metrics-card{border:0.5px solid var(--bdr);border-radius:var(--r-lg);padding:18px 20px}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metrics-grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.metrics-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.metrics-grid{grid-template-columns:1fr}}
.m-item{background:var(--bg2);border-radius:var(--r-md);padding:11px 13px}
.m-item .m-label{font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:500}
.m-item .m-emoji{font-size:14px;margin-right:2px}
.m-item .m-val{font-size:17px;font-weight:600;font-family:var(--mono);line-height:1.15}
.m-item .m-sub{font-size:11px;color:var(--txt3);margin-top:3px;line-height:1.4}
.m-item-wide{padding:14px 16px;margin-bottom:0}
.m-item-wide .m-val{font-size:24px}
.m-subhdr{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px}
.tax-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.tax-row{grid-template-columns:1fr 1fr}}
.tax-item{padding:8px 10px;border:0.5px solid var(--bdr);border-radius:var(--r-md)}
.tax-item .t-label{font-size:11px;color:var(--txt2);margin-bottom:2px}
.tax-item .t-val{font-size:13px;font-weight:500}
.tax-item .t-sub{font-size:10px;color:var(--txt3);margin-top:1px}

/* ── capital gains gauge ── */
.cg-gauge{margin-top:12px;padding:10px 12px;border:0.5px solid var(--bdr);border-radius:var(--r-md)}
.cg-title{font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:6px;display:flex;justify-content:space-between}
.cg-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:4px}
.cg-fill{height:100%;border-radius:4px;transition:width .4s}
.cg-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);font-family:var(--mono)}

/* ── fear/greed section ── */
.fg-section{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}

.fg-card .fc-sub{font-size:10px;color:var(--txt3);margin-top:2px}
.fg-gauge-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:6px}
.fg-gauge-fill{height:100%;border-radius:3px;transition:width .4s}

/* ── rebalancing ── */
.rebal-section{margin-bottom:20px}
.rebal-grid{display:grid;grid-template-columns:1fr 2fr;gap:8px}

.rebal-card{border-radius:var(--r-md);padding:12px 14px;border:0.5px solid var(--bdr);background:var(--bg2)}

.rb-table{width:100%;font-size:11px;border-collapse:collapse}
.rb-table th{color:var(--txt3);font-weight:500;padding:0 0 4px;text-align:right}
.rb-table th:first-child{text-align:left}

.rb-table td:first-child{text-align:left;color:var(--txt2)}
.rb-acct-title{font-size:10px;font-weight:600;color:var(--txt2);margin:8px 0 3px}
.rb-acct-title:first-child{margin-top:0}
.rebal-ok-msg{font-size:13px;color:var(--pos);padding:12px;text-align:center;background:var(--bg2);border-radius:var(--r-md);border:0.5px solid var(--bdr)}

/* ── modal ── */

/* ── loading/error ── */

/* ── journal tab ── */
.j-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}

.j-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 12px;border:0.5px solid var(--bdr);border-radius:var(--r-md);background:var(--bg2)}

<body>
<div id="app"><div class="state-msg">데이터 로딩 중...</div></div>

<!-- sparkline modal -->
<div class="modal-bg" id="sparkModal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modalTitle">추이</span>
      <span class="modal-close" onclick="document.getElementById('sparkModal').classList.remove('open')">✕</span>
    </div>
    <svg id="modalSvg" class="modal-svg" viewBox="0 0 320 80"></svg>
    <div id="modalDates" style="display:flex;justify-content:space-between;font-size:9px;color:var(--txt3);margin-top:4px;font-family:var(--mono)"></div>
  </div>
</div>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
const fmt   = n => Math.round(n).toLocaleString('ko-KR');
const fmtM  = n => { if(n>=1e8) return (n/1e8).toFixed(1)+'억'; if(n>=1e4) return (n/1e4).toFixed(0)+'만'; return fmt(n); };
const pct   = (n,t) => t>0 ? (n/t*100).toFixed(1)+'%' : '0%';
const pctN  = (n,t) => t>0 ? n/t*100 : 0;
const sign  = n => n>=0 ? '+' : '';
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function fmtUpdatedAt(iso) {
  try { return new Date(iso).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch { return iso; }
}

function deltaHtml(diff, diffPct, opts={}) {
  if(!diff && !diffPct) return '';
  const cls = diff>0?'pos':diff<0?'neg':'neu';
  const s = diff>=0?'+':'';
  const pctStr = diffPct!==undefined ? ` (${s}${diffPct.toFixed(1)}%)` : '';
  return `<div class="delta ${cls}">${s}${fmtM(Math.abs(diff))}${pctStr}</div>`;
}

function pptDeltaHtml(diff) {
  if(diff===0||diff===undefined) return '';
  const cls = diff>0?'pos':diff<0?'neg':'neu';
  return `<div class="delta ${cls}">${diff>0?'+':''}${diff.toFixed(1)}pp</div>`;
}

// ── sparkline ─────────────────────────────────────────────────────────────────
function sparkPts(vals, w, h) {
  if(!vals||vals.length<2) return '';
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  return vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w;
    const y=h-2-((v-mn)/rng)*(h-4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}

window._sparkData = {};

function renderSparkline(key, vals, color, w=80, h=24) {
  if(!vals||vals.length<2) return '';
  window._sparkData[key] = {vals, color};
  const pts = sparkPts(vals, w, h);
  return `<div class="spark-wrap"><svg width="${w}" height="${h}" class="spark-svg" onclick="openModal('${key}')" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>`;
}

function openModal(key) {
  const d = window._sparkData[key];
  if(!d) return;
  document.getElementById('modalTitle').textContent = key + ' 추이';
  const svg = document.getElementById('modalSvg');
  const pts = sparkPts(d.vals, 320, 80);
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const hist = (window._portfolioData?.sparkline_history)||[];
  const dates = hist.length >= 2 ? [hist[0].date, hist[hist.length-1].date] : [];
  const el = document.getElementById('modalDates');
  el.innerHTML = dates.length===2 ? `<span>${dates[0]}</span><span>${dates[1]}</span>` : '';
  document.getElementById('sparkModal').classList.add('open');
}
function closeModal(e) {
  if(e.target.id==='sparkModal') document.getElementById('sparkModal').classList.remove('open');
}

// ── market sections (top of page) ────────────────────────────────────────────
const MACRO_EMOJI = {USDKRW:'💱', DXY:'💵', US10Y:'📈', VIX:'😱', CL1:'🛢️'};
const ASSET_EMOJI = {BTC:'₿', NDX:'💎', GOLD:'🥇', KOSPI:'🇰🇷', ETH:'⟠'};
const CLS_EMOJI   = {us_stock:'📈', bond:'🏦', gold:'🥇', oil:'🛢', cash:'💵', crypto:'₿'};

function _msItem(emoji, name, priceStr, chgPct) {
  const c = chgPct>0?'chg-pos':chgPct<0?'chg-neg':'chg-neu';
  return `<div class="ms-item">
    <div class="ms-emoji">${emoji}</div>
    <div class="ms-meta">
      <div class="ms-name">${name}</div>
      <div class="ms-price">${priceStr}</div>
      <div class="ms-chg ${c}">${sign(chgPct)}${chgPct.toFixed(2)}%</div>
    </div>
  </div>`;
}
function _fmtMktPrice(p) {
  if(p>=1000)  return fmt(Math.round(p));
  if(p>=10)    return p.toFixed(2);
  return p.toFixed(3);
}

function renderMacroRow(d) {
  if(!d.markets) return '';
  const fxChg = d.markets.usdkrw_change_pct||0;
  let items = _msItem(MACRO_EMOJI.USDKRW, 'USD/KRW', fmt(d.usdkrw), fxChg);
  for(const [key, it] of Object.entries(d.markets.macro||{})) {
    const e = MACRO_EMOJI[key] || '📊';
    items += _msItem(e, it.name, _fmtMktPrice(it.price), it.change_pct);
  }
  return `
    <div class="market-section macro">
      <div class="ms-label">매크로</div>
      <div class="ms-items">${items}</div>
    </div>`;
}

function renderAssetsRow(d) {
  if(!d.markets || !d.markets.assets) return '';
  let items = '';
  for(const [key, it] of Object.entries(d.markets.assets)) {
    const e = ASSET_EMOJI[key] || '📊';
    items += _msItem(e, it.name, _fmtMktPrice(it.price), it.change_pct);
  }
  if(!items) return '';
  return `
    <div class="market-section assets">
      <div class="ms-label">자산</div>
      <div class="ms-items">${items}</div>
    </div>`;
}

// {value, change_pct} 구조 또는 flat 숫자 모두 지원
function _ciVal(x) {
  if(x == null) return null;
  return typeof x === 'object' ? x.value : x;
}
function _ciChg(x) {
  if(x == null || typeof x !== 'object') return null;
  return x.change_pct;
}
function _chgBadge(chg) {
  if(chg == null) return '';
  const cls = chg>0?'chg-pos':chg<0?'chg-neg':'chg-neu';
  const s = chg>=0?'+':'';
  return `<div class="ind-chg ${cls}">${s}${chg.toFixed(2)}%</div>`;
}

function renderIndicatorsRow(d) {
  const m = d.markets || {};
  const ci = d.crypto_indicators || {};
  const fg = m.fear_greed || {};
  const cards = [];

  function fgCard(obj, label) {
    if(!obj||obj.value==null) return '';
    const v = typeof obj.value==='number' ? obj.value : parseFloat(obj.value);
    const fc = v>=60?'#EF9F27':v>=40?'#D4A520':v>=25?'#378ADD':'#D85A30';
    return `<div class="ind-card">
      <div class="ind-label">${label}</div>
      <div class="ind-value" style="color:${fc}">${Math.round(v)}</div>
      <div class="ind-sub">${obj.label||''}</div>
      <div class="ind-bar"><div class="ind-bar-fill" style="width:${v}%;background:${fc}"></div></div>
    </div>`;
  }

  cards.push(fgCard(fg.crypto, '크립토 F&G'));
  cards.push(fgCard(fg.sp500,  'S&P F&G'));

  const btcd = _ciVal(ci.btc_dominance);
  if(btcd != null) {
    cards.push(`<div class="ind-card">
      <div class="ind-label">BTC 도미넌스</div>
      <div class="ind-value">${btcd.toFixed(1)}%</div>
      <div class="ind-sub">${btcd>55?'BTC 강세장':'알트 시즌'}</div>
      ${_chgBadge(_ciChg(ci.btc_dominance))}
    </div>`);
  }
  const usdtd = _ciVal(ci.usdt_dominance);
  if(usdtd != null) {
    cards.push(`<div class="ind-card">
      <div class="ind-label">USDT 도미넌스</div>
      <div class="ind-value">${usdtd.toFixed(1)}%</div>
      <div class="ind-sub">${usdtd>5?'시장 회피↑':'정상 수준'}</div>
      ${_chgBadge(_ciChg(ci.usdt_dominance))}
    </div>`);
  }
  const ethbtc = _ciVal(ci.eth_btc_ratio);
  if(ethbtc != null) {
    cards.push(`<div class="ind-card">
      <div class="ind-label">ETH/BTC</div>
      <div class="ind-value">${ethbtc.toFixed(4)}</div>
      <div class="ind-sub">${ethbtc>0.06?'ETH 강세':'BTC 강세'}</div>
      ${_chgBadge(_ciChg(ci.eth_btc_ratio))}
    </div>`);
  }
  const t3 = _ciVal(ci.total3_market_cap);
  if(t3 != null) {
    const t3B = (t3/1e9).toFixed(0);
    cards.push(`<div class="ind-card">
      <div class="ind-label">TOTAL3 시총</div>
      <div class="ind-value">${t3B}B$</div>
      <div class="ind-sub">BTC+ETH 제외</div>
      ${_chgBadge(_ciChg(ci.total3_market_cap))}
    </div>`);
  }

  const filled = cards.filter(c=>c);
  if(filled.length===0) return '';
  return `<div class="indicators-section">${filled.join('')}</div>`;
}

const CLS_META = {
  us_stock:{label:'주식',  bg:'#EEEDFE',fg:'#26215C',lbl:'#3C3489'},
  crypto:  {label:'크립토',bg:'#FAECE7',fg:'#4A1B0C',lbl:'#712B13'},
  bond:    {label:'채권',  bg:'#E6F1FB',fg:'#042C53',lbl:'#0C447C'},
  gold:    {label:'금',    bg:'#FAEEDA',fg:'#412402',lbl:'#633806'},
  oil:     {label:'원유',  bg:'#F1EFE8',fg:'#2C2C2A',lbl:'#444441'},
  cash:    {label:'현금',  bg:'#E1F5EE',fg:'#04342C',lbl:'#085041'},
};
const CLS_SPARK_COLOR = {
  us_stock:'#7F77DD',crypto:'#EF9F27',bond:'#378ADD',gold:'#D4A520',oil:'#D85A30',cash:'#1D9E75'
};

function renderMarketStrip(d) {
  const m = d.markets;
  if(!m||!m.indices) return '';

  const fxChg = m.usdkrw_change_pct;
  const fxCls = fxChg>0?'chg-pos':fxChg<0?'chg-neg':'chg-neu';
  let html = `<div class="mkt-item">
    <div class="mkt-name">USD/KRW</div>
    <div class="mkt-price">${fmt(d.usdkrw)}</div>
    <div class="mkt-chg ${fxCls}">${fxChg!=null?sign(fxChg)+fxChg.toFixed(2)+'%':'—'}</div>
  </div>`;

  for(const [key,idx] of Object.entries(m.indices)) {
    if(!idx) continue;
    const c = idx.change_pct>0?'chg-pos':idx.change_pct<0?'chg-neg':'chg-neu';
    const pStr = idx.price>=1000 ? fmt(Math.round(idx.price)) : idx.price.toFixed(1);
    html += `<div class="mkt-item">
      <div class="mkt-name">${idx.name}</div>
      <div class="mkt-price">${pStr}</div>
      <div class="mkt-chg ${c}">${sign(idx.change_pct)}${idx.change_pct.toFixed(2)}%</div>
    </div>`;
  }

  if(m.btc_dominance!=null) {
    html += `<div class="mkt-item">
      <div class="mkt-name">BTC 도미넌스</div>
      <div class="mkt-price">${m.btc_dominance.toFixed(1)}%</div>
      <div class="mkt-chg chg-neu">—</div>
    </div>`;
  }

  if(m.fear_greed) {
    const fg = m.fear_greed;
    const v  = fg.value;
    const fc = v>=60?'#EF9F27':v>=40?'#D4A520':v>=25?'#378ADD':'#D85A30';
    const lbl= v>=80?'Extreme Greed':v>=60?'Greed':v>=40?'Neutral':v>=25?'Fear':'Extreme Fear';
    html += `<div class="fg-item">
      <div class="mkt-name">공포·탐욕</div>
      <div class="mkt-price" style="color:${fc}">${v} — ${lbl}</div>
      <div class="fg-bar-wrap"><div class="fg-bar-fill" style="width:${v}%;background:${fc}"></div></div>
    </div>`;
  }

  return `<div class="market-strip">${html}</div>`;
}

// ── summary row ──────────────────────────────────────────────────────────────
function _clsCard(d, key, m) {
  const total = d.total_krw;
  const act = d.asset_class_totals;
  const dc = d.daily_change || {};
  const hist = d.sparkline_history || [];
  const last7 = hist.slice(-7);
  const v = act[key]||0;
  const clsDc = (dc.classes||{})[key];
  const deltaH = clsDc ? deltaHtml(clsDc.diff, clsDc.pct) : '';
  const sparkVals = last7.map(h => h[key==='us_stock'?'stock':key==='gold'?'gold':key==='oil'?'oil':key] || 0);
  const sparkH = renderSparkline(m.label, sparkVals, CLS_SPARK_COLOR[key]||'#888', 72, 20);
  return `
    <div class="cls-card" style="background:${m.bg}">
      <div class="label" style="color:${m.lbl}">${m.label}</div>
      <div class="pct" style="color:${m.fg}">${pct(v,total)}</div>
      <div class="amt" style="color:${m.lbl}">${fmt(v)}</div>
      ${deltaH}
      ${sparkH}
    </div>`;
}

function renderSummaryRow(d) {
  const total = d.total_krw;
  const act = d.asset_class_totals;
  const risk = (act.us_stock||0)+(act.crypto||0)+(act.oil||0);
  const safe = (act.bond||0)+(act.gold||0)+(act.cash||0);
  const dc = d.daily_change || {};
  const hist = d.sparkline_history || [];
  const last30 = hist.slice(-30);

  const riskDelta = dc.risky_pct ? pptDeltaHtml(dc.risky_pct.diff) : '';
  const safeDelta = dc.safe_pct  ? pptDeltaHtml(dc.safe_pct.diff)  : '';

  const riskSpark = renderSparkline('위험자산', last30.map(h=>(h.total-h.bond-h.gold-h.cash)), '#D85A30', 72, 22);
  const safeSpark = renderSparkline('안전자산', last30.map(h=>h.bond+h.gold+h.cash), '#1D9E75', 72, 22);

  const riskCard = `
    <div class="card-risk">
      <div class="label">위험자산</div>
      <div class="pct">${pct(risk,total)}</div>
      <div class="amt">${fmt(risk)}</div>
      ${riskDelta}
      ${riskSpark}
    </div>`;

  const safeCard = `
    <div class="card-safe">
      <div class="label">안전자산</div>
      <div class="pct">${pct(safe,total)}</div>
      <div class="amt">${fmt(safe)}</div>
      ${safeDelta}
      ${safeSpark}
    </div>`;

  // 위험행: 주식 → 크립토 → 원유
  const riskyClsHtml = ['us_stock','crypto','oil'].map(k => _clsCard(d, k, CLS_META[k])).join('');
  // 안전행: 채권 → 금 → 현금
  const safeClsHtml = ['bond','gold','cash'].map(k => _clsCard(d, k, CLS_META[k])).join('');

  return `
    <div class="summary-row-risky">${riskCard}${riskyClsHtml}</div>
    <div class="summary-row-safe">${safeCard}${safeClsHtml}</div>`;
}

// ── account grid ─────────────────────────────────────────────────────────────
function _acctClassBreakdown(d, accountId) {
  const account = (d.accounts||[]).find(a => a.id === accountId);
  if(!account || !account.krw) return [];
  const acctTotal = account.krw;
  const result = {};

  const core = (d.core_holdings||[]).find(h => h.account_id === accountId);
  const sat  = (d.satellite_holdings||[]).find(h => h.account_id === accountId);

  if(core) {
    let itemsSum = 0;
    for(const it of core.items||[]) {
      const cls = it.cls || 'us_stock';
      result[cls] = (result[cls]||0) + (it.krw||0);
      itemsSum += (it.krw||0);
    }
    const cash = acctTotal - itemsSum;
    if(cash > 100) result['cash'] = (result['cash']||0) + cash;
  } else if(sat) {
    const defaultCls = accountId==='toss' ? 'us_stock' : 'crypto';
    let itemsSum = 0;
    for(const it of sat.items||[]) {
      const cls = it.cls || defaultCls;
      result[cls] = (result[cls]||0) + (it.krw||0);
      itemsSum += (it.krw||0);
    }
    if(accountId === 'upbit') {
      const cash = acctTotal - itemsSum;
      if(cash > 1000) result['cash'] = (result['cash']||0) + cash;
    }
  } else {
    // emergency / biz: 100% cash
    result['cash'] = acctTotal;
  }

  const order = ['us_stock','crypto','bond','gold','oil','cash'];
  const rows = [];
  for(const cls of order) {
    const v = result[cls] || 0;
    if(v <= 0) continue;
    const p = v / acctTotal * 100;
    if(p < 0.1) continue;
    rows.push({cls, pct: p});
  }
  return rows;
}

function _renderAcctMiniCls(d, accountId) {
  const rows = _acctClassBreakdown(d, accountId);
  if(rows.length === 0) return '';
  // 우측 상단용 컴팩트 포맷: emoji + pct만 (라벨은 이모지로 식별)
  const parts = rows.map(r => {
    const emoji = CLS_EMOJI[r.cls] || '';
    return `${emoji} ${r.pct.toFixed(1)}%`;
  });
  return parts.join(' · ');
}

function renderAccountGrid(d) {
  const total = d.total_krw;
  const cards = d.accounts.map(a => {
    const p = pctN(a.krw, total);
    const usdLine = a.usd_amount!=null
      ? `<div class="sub" style="font-family:var(--mono);margin-top:1px">$${a.usd_amount.toLocaleString('en-US')}</div>`
      : '';
    let pnlLine = '';
    if(a.principal_krw && a.principal_krw > 0) {
      const sgn = a.pnl_krw >= 0 ? '+' : '';
      const cls = a.pnl_krw >= 0 ? 'pos' : 'neg';
      pnlLine = `<div class="acct-pnl">총 손익 <span class="acct-pnl-strong ${cls}">${sgn}${fmt(a.pnl_krw)} (${sgn}${a.pnl_pct.toFixed(2)}%)</span></div>`;
    }
    let d1Line = '';
    if(a.daily_change && (a.daily_change.diff || a.daily_change.pct)) {
      const dd = a.daily_change;
      const cls = dd.diff > 0 ? 'up' : dd.diff < 0 ? 'down' : '';
      const arrow = dd.diff > 0 ? '▲' : dd.diff < 0 ? '▼' : '·';
      const sgn = dd.diff >= 0 ? '+' : '-';
      const av = Math.abs(dd.diff);
      d1Line = `<div class="acct-d1">어제比 <span class="${cls}">${arrow} ${sgn}${fmt(av)} (${sgn}${Math.abs(dd.pct).toFixed(2)}%)</span></div>`;
    }
    const miniRight = _renderAcctMiniCls(d, a.id);
    return `
      <div class="acct-card">
        <div class="bar" style="background:${a.color}"></div>
        <div class="top-row">
          <div class="left"><div class="name">${a.name}</div><div class="sub">${a.subtitle}</div></div>
          <div class="right">${miniRight}</div>
        </div>
        <div class="amount">${fmt(a.krw)}</div>
        ${usdLine}
        <div class="pct-row">
          <span class="pct-val">${p.toFixed(1)}%</span>
          <div class="pbar"><div class="pbar-fill" style="background:${a.color};width:${clamp(p,0,100)}%"></div></div>
        </div>
        ${pnlLine}
        ${d1Line}
      </div>`;
  }).join('');
  return `<div class="account-grid">${cards}</div>`;
}

// ── split buying bar ─────────────────────────────────────────────────────────
function renderSplitBuying(sb) {
  if(!sb) return '';
  const pctDone = sb.target_total>0 ? (sb.completed/sb.target_total*100) : 0;
  const remaining = sb.target_total - sb.completed;

  // D-day
  let ddayStr = '';
  if(sb.next_date) {
    const next = new Date(sb.next_date);
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((next-today)/864e5);
    ddayStr = diff===0 ? 'D-day' : diff>0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
  }

  const rounds = (sb.schedule||[]).map(r => {
    const label = r.status==='done' ? `R${r.round} ✓` : `R${r.round}`;
    return `<div class="sb-round ${r.status}">${label} ${fmtM(r.amount)}</div>`;
  }).join('');

  const barColor = pctDone>=100 ? '#1D9E75' : '#534AB7';
  return `
    <div class="split-buy">
      <div class="sb-title">
        <span>분할매수 진행도</span>
        <span style="font-family:var(--mono);font-size:10px">${ddayStr ? `다음 ${ddayStr}` : ''}</span>
      </div>
      <div class="sb-track"><div class="sb-fill" style="width:${clamp(pctDone,0,100)}%;background:${barColor}"></div></div>
      <div class="sb-meta">
        <span>${fmtM(sb.completed)} / ${fmtM(sb.target_total)}</span>
        <span>${pctDone.toFixed(0)}% 완료 · 잔여 ${fmtM(remaining)}</span>
      </div>
      <div class="sb-rounds">${rounds}</div>
    </div>`;
}

// ── NVDA MDD gauge ────────────────────────────────────────────────────────────
function renderNvdaMdd(mdd) {
  if(!mdd||!mdd.avg_price_krw) return '';
  const v = mdd.mdd_pct;
  const MIN=-30, MAX=10, RANGE=MAX-MIN;

  // segment widths (% of track)
  const greenEnd  = (MAX-(-15))/RANGE*100;   // +10% to -15%: safe zone
  const yellowEnd = (MAX-(-25))/RANGE*100;   // -15% to -25%: warning
  const redEnd    = 100;                      // -25% to -30%: danger

  // marker position
  const markerPct = clamp((MAX-v)/RANGE*100, 0, 100);

  const valCls = v >= -15 ? '#1D9E75' : v >= -25 ? '#EF9F27' : '#D85A30';
  const statusText = v >= 0 ? '평단 이상 ✓' : v >= -15 ? '안전' : v >= -25 ? '⚠ 주의' : '🔴 위험';

  return `
    <div class="nvda-mdd">
      <div class="mdd-title">
        <span>NVDA 평단 대비 MDD</span>
        <span class="mdd-val" style="color:${valCls}">${sign(v)}${v.toFixed(1)}% (${statusText})</span>
      </div>
      <div class="mdd-track-wrap">
        <div class="mdd-seg-green"  style="width:${greenEnd}%"></div>
        <div class="mdd-seg-yellow" style="left:${greenEnd}%;width:${yellowEnd-greenEnd}%"></div>
        <div class="mdd-seg-red"    style="left:${yellowEnd}%;width:${redEnd-yellowEnd}%"></div>
        <div class="mdd-marker"     style="left:${markerPct}%"></div>
      </div>
      <div class="mdd-labels"><span>+10%</span><span>-15%</span><span>-25%</span><span>-30%</span></div>
      <div class="mdd-info">평단 ${fmt(mdd.avg_price_krw)}원 → 현재 ${fmt(mdd.current_price_krw)}원</div>
    </div>`;
}

// ── account rebalancing header ───────────────────────────────────────────────
function renderAcctRebal(accountId, d) {
  if(!d.rebalancing) return '';
  const acct = (d.rebalancing.per_account||[]).find(a => a.account_id === accountId);
  if(!acct||!acct.class_rows||acct.class_rows.length===0) return '';

  // 계좌 내 현금 비중 ("현재" 줄에만 표시)
  const breakdown = _acctClassBreakdown(d, accountId);
  const cashEntry = breakdown.find(r => r.cls === 'cash');
  const cashPct = cashEntry ? cashEntry.pct : 0;

  function fmtRow(rows, useActual) {
    let items = rows;
    if(useActual && cashPct > 0) {
      items = [...rows, {cls: 'cash', name: '현금', target: 0, actual: +cashPct.toFixed(1), diff: 0}];
    }
    return items.map((r,i) => {
      const val = useActual ? r.actual : r.target;
      // cash는 룰에 없는 잔여이므로 alert 적용 안 함
      const alert = useActual && r.cls !== 'cash' && Math.abs(r.diff)>5 ? ' alert' : '';
      const sep = i<items.length-1 ? '<span class="arb-sep">·</span>' : '';
      const emoji = CLS_EMOJI[r.cls] || '';
      return `<span class="arb-item${alert}">${emoji} ${r.name} ${val}%</span>${sep}`;
    }).join('');
  }

  return `
    <div class="acct-rebal">
      <div class="acct-rebal-row"><span class="acct-rebal-lbl">🎯 기준</span>${fmtRow(acct.class_rows, false)}</div>
      <div class="acct-rebal-row"><span class="acct-rebal-lbl">📊 현재</span>${fmtRow(acct.class_rows, true)}</div>
    </div>`;
}

// ── core table ───────────────────────────────────────────────────────────────
function _acctPnlSummaryHtml(d, accountId) {
  const a = (d.accounts||[]).find(x => x.id === accountId);
  if(!a || !a.principal_krw || a.principal_krw <= 0) return '';
  const cls = a.pnl_krw >= 0 ? 'pos' : 'neg';
  const s = a.pnl_krw >= 0 ? '+' : '';
  return `<div class="acct-pnl-summary ${cls}">${s}${fmt(a.pnl_krw)} (${s}${a.pnl_pct.toFixed(2)}%)</div>`;
}

function renderCoreTable(h, total, d) {

    const hasPnl = item.principal_krw > 0;
    const pnlCls = item.pnl_krw >= 0 ? 'pos' : 'neg';

    return `
    <div class="grid-row">
      <div class="color-bar" style="background:${item.color}"></div>

      <div class="gpnl ${hasPnl?pnlCls:''}">${hasPnl?s+fmt(item.pnl_krw):'—'}</div>
      <div class="gpnlpct ${hasPnl?pnlCls:''}">${hasPnl?s+item.pnl_pct.toFixed(2)+'%':'—'}</div>

      <div class="cat">cash</div>
      <div class="ticker-wrap">

  const globalRows = (rb.global||[]).map(row => {

    return `<tr>
      <td>${row.name}</td>
      <td>${row.target.toFixed(0)}%</td>
      <td>${row.actual.toFixed(1)}%</td>

        <tbody>${globalRows}</tbody>

  const acctBlocks = (rb.per_account||[]).map(acct => {
    const rows = (acct.rows||[]).map(row => {
      const dev = row.diff;

      return `<tr>
        <td style="font-family:var(--mono)">${row.ticker}</td>
        <td>${row.target>0?row.target.toFixed(0)+'%':'—'}</td>
        <td>${row.actual.toFixed(1)}%</td>
        <td class="${devCls}">${row.target>0?(dev>=0?'+':'')+dev.toFixed(1)+'pp':'—'}</td>

    }).join('');
    return `
      <div class="rb-acct-title">${acct.account_name}</div>
      <table class="rb-table">
        <thead><tr><th>티커</th><th>목표</th><th>실제</th><th>편차</th></tr></thead>
        <tbody>${rows}</tbody>

  }).join('');
  const cardB = `
    <div class="rebal-card">
      <div class="rc-label">계좌별 섹터 비중 (KIS)</div>

function renderTransactionsTable(txns) {

    return `<div class="j-table-wrap"><div class="j-empty">조건에 맞는 거래가 없습니다</div></div>`;
  }
  const rows = txns.map(t => {
    const side = t.side || 'buy';
    const sideKr = side==='buy' ? '매수' : '매도';
    const sideCls = side==='buy' ? 'j-side-buy' : 'j-side-sell';
    const exch = EXCH_LABEL[t.exchange] || t.exchange || t.account || '';
    const amount = t.amount_krw || (t.amount * (t.currency==='USD'?1380:1)) || 0;

      <td>${exch}</td>

      <td class="${sideCls}">${sideKr}</td>

      <td class="r j-mono">${price}</td>

          <th class="r">수량</th><th class="r">단가</th><th class="r">금액(KRW)</th><th>사유 메모</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

window._journalFilters = {exch:'all', side:'all', period:'30'};

function applyJournalFilters() {
  const d = window._portfolioData;
  if(!d) return;
  const f = window._journalFilters;
  const all = d.transactions || [];
  const exchKey = (e) => {
    if(e==='업비트') return 'upbit';
    if(e==='OKX') return 'okx';
    if(e==='한투 종합') return 'kis_jonghap';
    if(e==='한투 ISA') return 'kis_isa';
    if(e==='한투 연저') return 'kis_yeon';
    return e;
  };
  const cutoffDate = f.period==='all' ? '0000-01-01'
    : new Date(Date.now()-parseInt(f.period)*86400000).toISOString().slice(0,10);
  const filtered = all.filter(t => {
    if(f.side!=='all' && t.side!==f.side) return false;
    if(f.exch!=='all' && exchKey(t.exchange)!==f.exch) return false;
    if((t.date||'') < cutoffDate) return false;
    return true;
  });
  const tbl = document.getElementById('journal-table');
  if(tbl) tbl.innerHTML = renderTransactionsTable(filtered);
}

function renderTaxSimulator(d) {
  const cg = d.capital_gains || {};
  const limit = cg.limit || 2500000;
  const used = cg.ytd_gain || 0;
  const remaining = Math.max(0, limit - used);
  return `
    <div class="j-sim">

                 oninput="calcTaxSim()">
        </div>
        <div>
          <div style="font-size:11px;color:var(--txt3);margin-bottom:4px">현재 YTD 사용액</div>
          <div class="j-sim-input" style="background:var(--bg2);font-family:var(--mono)">${fmt(used)} / ${fmt(limit)} (잔여 ${fmt(remaining)})</div>

      </div>
      <div style="font-size:10px;color:var(--txt3);margin-top:6px">
        * 시뮬레이션 전용 — 250만원 면세 후 22% 세율, 한투 + 토스 합산 한도
      </div>
    </div>`;
}

function calcTaxSim() {
  const cg = (window._portfolioData||{}).capital_gains || {};
  const used = cg.ytd_gain || 0;
  const limit = cg.limit || 2500000;
  const inputEl = document.getElementById('sim-gain');
  const out = document.getElementById('sim-result');
  if(!inputEl || !out) return;
  const gain = parseFloat(inputEl.value) || 0;
  if(gain<=0) {
    out.innerHTML = `<div class="j-sim-result-row"><span>매매차익</span><span class="j-mono">— 입력 대기</span></div>`;
    return;
  }
  const newTotal = used + gain;
  const taxableBefore = Math.max(0, used - limit);
  const taxableAfter = Math.max(0, newTotal - limit);
  const taxableDelta = taxableAfter - taxableBefore;
  const tax = Math.round(taxableDelta * 0.22);
  const usedAfter = newTotal;
  const usedPct = Math.min(100, usedAfter/limit*100);
  out.innerHTML = `
    <div class="j-sim-result-row"><span>예상 매매차익</span><span class="j-mono">${fmt(gain)}원</span></div>
    <div class="j-sim-result-row"><span>면세 한도 ${usedPct.toFixed(0)}% 사용 (${fmt(usedAfter)}/${fmt(limit)})</span><span class="j-mono">${fmt(Math.max(0,limit-usedAfter))} 잔여</span></div>
    <div class="j-sim-result-row"><span>과세 대상 (한도 초과분)</span><span class="j-mono">${fmt(taxableDelta)}원</span></div>
    <div class="j-sim-result-row tot"><span>예상 양도세 (22%)</span><span class="j-mono ${tax>0?'chg-neg':''}">${fmt(tax)}원</span></div>`;
}

  return `

    ${renderJournalFilters()}
    <div id="journal-table">${renderTransactionsTable(txns.slice(0, 200))}</div>
    ${renderTaxSimulator(d)}`;
}

      <div class="r-card">
        <div class="rc-label">평균 결정 점수</div>
        <div class="rc-val ${avg>0?'chg-pos':avg<0?'chg-neg':''}">${sign(avg)}${avg.toFixed(1)}%</div>
        <div class="rc-sub">방향 보정 평균 (좋은 방향 +)</div>
      </div>
    </div>`;
}

function renderReviewItem(r) {
  const side = r.side || 'buy';
  const sideKr = side==='buy' ? '매수' : '매도';
  const pct = r.result_pct || 0;
  const cls = _outcomeCls(side, pct);
  const emoji = cls==='good'?'✓':cls==='bad'?'✗':'◯';
  const label = r.outcome_label || (cls==='good'?'좋은 결정':cls==='bad'?'아쉬움':'무난');
  const reviewDate = r.review_date || '';
  const tradePrice = r.price || 0;
  const futurePrice = r.future_price || 0;
  const isUSD = r.currency === 'USD';
  const fmtP = p => isUSD ? '$'+p.toFixed(2) : fmt(p);
  return `
    <div class="r-item">
      <div class="r-emoji ${cls}">${emoji}</div>
      <div>
        <div class="r-ticker">${r.ticker || r.name || ''}</div>
        <div class="r-side">${sideKr} · ${(r.date||'').slice(5)}</div>
      </div>
      <div class="r-meta">
        ${label} — 30일 후 ${reviewDate.slice(5)}
      </div>
      <div class="r-price">
        ${fmtP(tradePrice)} → ${fmtP(futurePrice)}
      </div>
      <div class="r-result ${pct>0?'pos':pct<0?'neg':''}">${sign(pct)}${pct.toFixed(1)}%</div>
    </div>`;
}

function renderReviewInsight(d) {
  const s = d.review_summary || {};
  const reviews = d.reviews || [];
  if(reviews.length === 0) return '';

  // 매수 후 평균 / 매도 후 평균 분리
  const buys = reviews.filter(r => r.side === 'buy');
  const sells = reviews.filter(r => r.side === 'sell');
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+(b.result_pct||0),0)/arr.length : 0;
  const buyAvg = avg(buys);
  const sellAvg = avg(sells);

  // best/worst
  const best = s.best, worst = s.worst;
  const bestStr = best && best.ticker ? `${best.ticker} (${best.side==='buy'?'매수':'매도'} ${sign(best.result_pct)}${(best.result_pct||0).toFixed(1)}%)` : '—';
  const worstStr = worst && worst.ticker ? `${worst.ticker} (${worst.side==='buy'?'매수':'매도'} ${sign(worst.result_pct)}${(worst.result_pct||0).toFixed(1)}%)` : '—';

  return `
    <div class="r-insight">
      <div class="r-insight-title">📊 패턴 인사이트</div>
      <div class="r-insight-grid">
        <div class="r-insight-card">
          <div class="ri-tag">매수 후 평균 (n=${buys.length})</div>
          <div style="font-family:var(--mono);font-size:14px;font-weight:600" class="${buyAvg>0?'chg-pos':'chg-neg'}">
            ${sign(buyAvg)}${buyAvg.toFixed(1)}%
          </div>
        </div>
        <div class="r-insight-card">
          <div class="ri-tag">매도 후 평균 (n=${sells.length})</div>
          <div style="font-family:var(--mono);font-size:14px;font-weight:600" class="${sellAvg<0?'chg-pos':'chg-neg'}">
            ${sign(sellAvg)}${sellAvg.toFixed(1)}%
          </div>
        </div>
        <div class="r-insight-card">
          <div class="ri-tag">🏆 최고 결정</div>
          <div style="font-size:12px">${bestStr}</div>
        </div>
        <div class="r-insight-card">
          <div class="ri-tag">😞 최악 결정</div>
          <div style="font-size:12px">${worstStr}</div>
        </div>
      </div>
    </div>`;
}

// ── calendar tab ──────────────────────────────────────────────────────────────
function renderCalendarItem(e) {
  const dDay = e.d_day;
  const passed = dDay < 0;
  const urgent = dDay >= 0 && dDay <= 3;
  const dDayStr = passed ? `D+${-dDay}` : dDay === 0 ? '오늘' : `D-${dDay}`;
  const importance = e.importance || 'mid';
  const type = e.type || 'misc';
  const typeLbl = {fomc:'FOMC', kbok:'금통위', earnings:'실적', misc:'기타'}[type] || type;
  return `
    <div class="cal-item ${importance} ${urgent?'imminent':''}">
      <div class="cal-dday ${urgent?'urgent':''}">${dDayStr}</div>
      <div>
        <div class="cal-title">${e.title}</div>
        <div class="cal-meta">${e.time || ''}${e.ticker?' · '+e.ticker:''}</div>
      </div>
      <div class="cal-date">${e.date}</div>
      <div class="cal-type-badge ${type}">${typeLbl}</div>
    </div>`;
}

function renderCalendarTab(d) {
  const events = d.calendar_events || [];
  if(events.length === 0) {
    return `<div class="state-msg">캘린더 이벤트가 없습니다</div>`;
  }
  const future = events.filter(e => e.d_day >= 0);
  const past = events.filter(e => e.d_day < 0);
  const imminent = future.filter(e => e.d_day <= 7);

  const sec = (title, items) => items.length ? `
    <div class="sec-label" style="margin-top:14px">${title}</div>
    <div class="cal-list">${items.map(renderCalendarItem).join('')}</div>` : '';

  return `
    ${sec(`🚨 임박 (7일 이내) — ${imminent.length}건`, imminent)}
    ${sec(`📅 예정 — ${future.length - imminent.length}건`, future.filter(e => e.d_day > 7))}
    ${sec(`📜 최근 (지난 7일) — ${past.length}건`, past)}
    <div style="margin-top:18px;padding:10px 14px;background:var(--bg2);border-radius:6px;font-size:11px;color:var(--txt3)">
      📌 FOMC/금통위 일정은 정기 갱신 필요. 실적 발표일은 yfinance 기준이라 변동 가능.
    </div>`;
}

// ── xray tab ─────────────────────────────────────────────────────────────────
function renderXraySectors(sectors) {
  if(!sectors || sectors.length === 0) return '';
  const pills = sectors.map(s =>
    `<div class="xr-pill"><span class="xp-label">${s.sector}</span><span class="xp-val">${s.pct.toFixed(1)}%</span></div>`
  ).join('');
  return `
    <div class="xr-section">
      <div class="xr-section-title">섹터 노출</div>
      <div class="xr-pills">${pills}</div>
    </div>`;
}

function renderXrayRegions(regions) {
  if(!regions || regions.length === 0) return '';
  const pills = regions.map(r =>
    `<div class="xr-pill"><span class="xp-label">${r.region}</span><span class="xp-val">${r.pct.toFixed(1)}% (${fmtM(r.krw)})</span></div>`
  ).join('');
  return `
    <div class="xr-section">
      <div class="xr-section-title">지역 노출</div>
      <div class="xr-pills">${pills}</div>
    </div>`;
}

function renderXrayLookThrough(lt) {
  if(!lt || lt.length === 0) return '';
  const max = lt[0].pct || 1;
  const rows = lt.map(r => {
    const fillPct = (r.pct / max * 100).toFixed(0);
    const direct = r.direct || 0;
    const indirect = r.indirect || 0;
    return `<tr>
      <td>${r.symbol}</td>
      <td class="r">${fmt(direct)}</td>
      <td class="r">${fmt(indirect)}</td>
      <td class="r"><strong>${fmt(r.krw)}</strong></td>
      <td class="r">${r.pct.toFixed(2)}%
        <div class="xr-bar"><div class="xr-bar-fill" style="width:${fillPct}%"></div></div>
      </td>
    </tr>`;
  }).join('');
  return `
    <div class="xr-section">
      <div class="xr-section-title">실질 종목 노출 Top ${lt.length} (ETF 분해 후)</div>
      <table class="xr-table">
        <thead><tr>
          <th>종목</th>
          <th class="r">직접</th>
          <th class="r">ETF 간접</th>
          <th class="r">합계 (KRW)</th>
          <th class="r">비중</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderXrayTab(d) {
  const x = d.xray || {};
  const lt = x.look_through || [];
  if(lt.length === 0) {
    return `<div class="state-msg">X-Ray 데이터가 없습니다 (보유 종목 없음)</div>`;
  }
  return `
    ${renderXraySectors(x.sectors || [])}
    ${renderXrayRegions(x.regions || [])}
    ${renderXrayLookThrough(lt)}
    <div style="margin-top:14px;padding:10px 14px;background:var(--bg2);border-radius:6px;font-size:11px;color:var(--txt3)">
      📌 ETF 구성 종목은 공식 disclosure 기반 top 10. 잔여분은 ETF 자체로 카운트.
      AGIX/QQQM/426030/456600 정기 갱신 필요 (현재 ~2026-04 기준).
    </div>`;
}

function renderReviewTab(d) {
  const reviews = d.reviews || [];
  if(reviews.length === 0) {
    return `
      ${renderReviewSummary(d)}
      <div class="state-msg">
        아직 30일 이상 경과한 거래가 없거나 회고 데이터가 비어있습니다.<br>
        <small>거래 후 30일이 지나면 자동으로 결과가 평가됩니다.</small>
      </div>`;
  }
  // 최신 거래일 기준 desc 정렬
  const sorted = [...reviews].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const items = sorted.slice(0, 50).map(renderReviewItem).join('');
  return `
    ${renderReviewSummary(d)}
    ${renderReviewInsight(d)}
    <div class="r-list">${items}</div>`;
}

function attachJournalHandlers() {
  document.querySelectorAll('.j-pill').forEach(b => {
    b.addEventListener('click', () => {
      const grp = b.dataset.jf;
      const val = b.dataset.val;
      // 같은 그룹 active 토글
      document.querySelectorAll(`.j-pill[data-jf="${grp}"]`).forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      window._journalFilters[grp] = val;
      applyJournalFilters();
    });
  });
  // 초기 필터 적용 (기본 30일)
  applyJournalFilters();
}

// ── main render ───────────────────────────────────────────────────────────────
// 누적 표시(기존): 미국식 pos/neg 색상. 헤더 D-1(신규): 한국식 up/down 색상.
function _headerDeltaHtml(diff, diffPct) {
  if(!diff && !diffPct) return '';
  const cls = diff>0?'pos':diff<0?'neg':'neu';
  const s = diff>=0?'+':'-';
  const av = Math.abs(diff);
  const pctStr = diffPct!==undefined ? ` (${s}${Math.abs(diffPct).toFixed(1)}%)` : '';
  return `<span class="total-delta-val ${cls}">${s}${fmt(av)}${pctStr}<span class="delta-label">누적</span></span>`;
}

function _headerD1Html(diff, diffPct) {
  if(!diff && !diffPct) return '';
  const cls = diff>0?'up':diff<0?'down':'neu';
  const arrow = diff>0?'▲':diff<0?'▼':'·';
  const s = diff>=0?'+':'-';
  const av = Math.abs(diff);
  const pctStr = diffPct!==undefined && diffPct!==null ? ` (${s}${Math.abs(diffPct).toFixed(2)}%)` : '';
  return `<span class="total-delta-val ${cls}">${arrow} ${s}${fmt(av)}${pctStr}<span class="delta-label">어제比</span></span>`;
}

function render(d) {
  window._portfolioData = d;
  const dc = d.daily_change || {};
  // 누적: sparkline 시작점(약 30일 전) → 오늘
  const hist = d.sparkline_history || [];
  let cumDiff = 0, cumPct = 0;
  if(hist.length >= 2) {
    const startTotal = hist[0].total || 0;
    if(startTotal > 0) {
      cumDiff = d.total_krw - startTotal;
      cumPct  = cumDiff / startTotal * 100;
    }
  }
  const totalDelta = (cumDiff || cumPct) ? _headerDeltaHtml(cumDiff, cumPct) : '';
  // D-1: 어제 스냅샷 → 오늘
  const totalD1    = dc.total ? _headerD1Html(dc.total.diff, dc.total.pct) : '';

  const totalUsd = (d.usdkrw && d.total_krw) ? Math.round(d.total_krw / d.usdkrw) : 0;
  const totalUsdHtml = totalUsd ? `<span class="total-usd">≈ $${totalUsd.toLocaleString('en-US')}</span>` : '';

  const html = `
    <div class="hdr">
      <div>
        <h1>포트폴리오 대시보드</h1>
        <div class="total-krw">
          <span>총 자산 <strong>${fmt(d.total_krw)}</strong>원</span>
          ${totalUsdHtml}
          ${totalDelta}
          ${totalD1}
        </div>
        <div class="total-fx">USD/KRW ${fmt(d.usdkrw)}</div>
      </div>
      <div class="hdr-meta">
        <span>마지막 갱신 ${fmtUpdatedAt(d.updated_at)}</span>
        <button class="png-btn" id="pngBtn" onclick="downloadPng()">📷 PNG 저장</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="dashboard">📊 자산 현황</button>
      <button class="tab" data-tab="journal">📝 매매일지</button>
      <button class="tab" data-tab="review">📈 회고</button>
      <button class="tab" data-tab="calendar">📅 캘린더</button>
      <button class="tab" data-tab="xray">🔍 X-Ray</button>
    </div>
    <div id="tab-dashboard" class="tab-content active">
      <div class="sec-label">시장 컨텍스트</div>
      ${renderMacroRow(d)}
      ${renderAssetsRow(d)}
      ${renderIndicatorsRow(d)}
      <div class="sec-label">자산 비율</div>
      ${renderSummaryRow(d)}
      <div class="sec-label">계좌별 현황</div>
      ${renderAccountGrid(d)}
      <div class="sec-label">종목 상세</div>
      ${renderHoldings(d)}
      <div class="sec-label">보조 지표</div>
      ${renderMetrics(d)}
    </div>
    <div id="tab-journal" class="tab-content">
      ${renderJournalTab(d)}
    </div>
    <div id="tab-review" class="tab-content">
      ${renderReviewTab(d)}
    </div>
    <div id="tab-calendar" class="tab-content">
      ${renderCalendarTab(d)}
    </div>
    <div id="tab-xray" class="tab-content">
      ${renderXrayTab(d)}
    </div>`;

  document.getElementById('app').innerHTML = html;

  // 탭 전환
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    });
  });

  // 매매일지 필터 핸들러 (탭 전환 무관 — 초기 1회 바인딩)
  attachJournalHandlers();
}

// ── PNG 다운로드 ──────────────────────────────────────────────────────────────
async function downloadPng() {
  const btn = document.getElementById('pngBtn');
  if(!window.html2canvas) {
    alert('html2canvas 로드 실패');
    return;
  }
  const target = document.getElementById('tab-dashboard');
  if(!target) return;
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ 생성 중...';
  try {
    const bg = getComputedStyle(document.body).backgroundColor;
    const canvas = await html2canvas(target, {
      scale: 3, useCORS: true, backgroundColor: bg, logging: false,
      windowWidth: target.scrollWidth, windowHeight: target.scrollHeight,
    });
    const link = document.createElement('a');
    link.download = `portfolio_${new Date().toISOString().split('T')[0]}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('PNG 생성 실패: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

fetch('data.json')
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="state-msg">데이터 로드 실패: ${err.message}<br><small>data.json 파일을 확인하세요</small></div>`;
  });
</script>
</body>
</html>
