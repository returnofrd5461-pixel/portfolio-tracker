name: Hourly Portfolio Tracker

on:
  schedule:
    - cron: "0 22-23 * * *"   # UTC 22–23 = KST 07–08
    - cron: "0 0-16/2 * * *"  # UTC 0,2,4,6,8,10,12,14,16 = KST 09,11,13,15,17,19,21,23,01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio pipeline
        env:
          KIS_APP_KEY_JONGHAP: ${{ secrets.KIS_APP_KEY_JONGHAP }}
          KIS_APP_SECRET_JONGHAP: ${{ secrets.KIS_APP_SECRET_JONGHAP }}
          KIS_ACCOUNT_JONGHAP: ${{ secrets.KIS_ACCOUNT_JONGHAP }}
          KIS_APP_KEY_ISA: ${{ secrets.KIS_APP_KEY_ISA }}
          KIS_APP_SECRET_ISA: ${{ secrets.KIS_APP_SECRET_ISA }}
          KIS_ACCOUNT_ISA: ${{ secrets.KIS_ACCOUNT_ISA }}
          KIS_APP_KEY_YEON: ${{ secrets.KIS_APP_KEY_YEON }}
          KIS_APP_SECRET_YEON: ${{ secrets.KIS_APP_SECRET_YEON }}
          KIS_ACCOUNT_YEON: ${{ secrets.KIS_ACCOUNT_YEON }}
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HOLDINGS_DB: ${{ secrets.NOTION_HOLDINGS_DB }}
          NOTION_SNAPSHOT_DB: ${{ secrets.NOTION_SNAPSHOT_DB }}
          NOTION_TRANSACTIONS_DB: ${{ secrets.NOTION_TRANSACTIONS_DB }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/main.py

      - name: Commit and push docs/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "chore: update portfolio data $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
          git push
